                  cloud_marketplace: aws
                  subscription_change_ids:
                  - y3jg5Vl_-N0
                - invoice_id: '579270481'
                  disbursement_date: '2021-01-12T23:45:55'
                  product:
                    name: Tackle Cloud Marketplace Platform
                    id: rJ2fuuZVHXWPaTtfGBSD7d7ht
                    tackle_product_ref_id: null
                  transaction:
                    id: YqJ2DUU8VPAH7G6vE7WuQLB9heePw7DcHt2K2rqywz8rBEiTaGSqD3k
                    seller_revenue:
                      amount: 27995
                      currency: USD
                    marketplace_fee:
                      amount: -2239.6
                      currency: USD
                    net_amount:
                      amount: 25755.4
                      currency: USD
                  customer:
                    account_number: null
                    address:
                      country: null
                      city: null
                      zip_code: null
                      email_domain: null
                  cloud_marketplace: aws
                  subscription_change_ids:
                  - i8jg5Vl_-L5
                - invoice_id: '669572946747'
                  disbursement_date: '2021-01-24T14:16:04'
                  product:
                    name: Tackle SaaS Platform for AWS Marketplace
                    id: HXQTgE2MmTQyuDHJpSVsRsrqL
                    tackle_product_ref_id: null
                  transaction:
                    id: RAyQyNo4BLamAcquLXA9fkPMkHJKBke6WBPXKrTQ8iMFehUomVpSGyR
                    seller_revenue:
                      amount: 1100
                      currency: USD
                    marketplace_fee:
                      amount: -88
                      currency: USD
                    net_amount:
                      amount: 1012
                      currency: USD
                  customer:
                    account_number: null
                    address:
                      country: null
                      city: null
                      zip_code: null
                      email_domain: null
                  cloud_marketplace: aws
