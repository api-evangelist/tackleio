      enum:
      - STATE_UNSPECIFIED
      - DRAFT
      - SUBMITTED
      - ACCEPTED
      - NOT_ACCEPTED
    Opportunity_2:
      type: object
      description: 'Tackle''s opportunity payload. Mirrors the Google Cloud Channel

        `Opportunity` (v1alpha1) schema and adds a `$tkl-metadata`

        block carrying Tackle-specific state — CRM linkage,

        attribute-syncing subscription ID, and Salesforce sync error

        summary.'
      properties:
        $tkl-metadata:
          $ref: '#/components/schemas/OpportunityMetadata_2'
        name:
          type: string
          description: 'Resource name of the opportunity in the form

            `opportunities/{opportunity_id}`. Populated by Google Cloud

            Channel after the first successful create; integrators

            should treat this field as read-only — values supplied on

            create or update are ignored.'
          example: opportunities/Sx1elvqtRdNZQg
        customerDisplayName:
          type: string
          description: 'Output only. Display name for the customer organization as

            resolved by Google Cloud Channel. May be normalized or

            disambiguated relative to the

            `customerInfo.customerDetails.organizationName` value

            submitted on create.'
        state:
          $ref: '#/components/schemas/State'
        stateDescription:
          type: string
          description: Output only. Reason the opportunity was not accepted.
        stage:
          $ref: '#/components/schemas/Stage'
        owner:
          type: string
          description: 'Output only. Name of the Google field sales representative

            (FSR) who owns the opportunity inside Google.'
        ownerEmail:
          type: string
          description: 'Output only. Email of the Google field sales representative

            (FSR) who owns the opportunity inside Google.'
        creatorEmail:
          type: string
          description: 'Output only. Email associated with the creator of the

            opportunity. For opportunities created via this API, this

            is the email associated with the integrator''s M2M client

            credentials (see the Authentication section in the spec

            description). For opportunities created elsewhere (such as

            the Tackle UI), this is the human user''s email.'
        source:
          $ref: '#/components/schemas/Source'
        opportunityInfo:
          $ref: '#/components/schemas/OpportunityInfo'
        qualificationInfo:
          $ref: '#/components/schemas/QualificationInfo'
        customerInfo:
          $ref: '#/components/schemas/CustomerInfo'
        isvSolutionConnectInfo:
          $ref: '#/components/schemas/IsvSolutionConnectInfo'
        partnerInfo:
          $ref: '#/components/schemas/PartnerInfo'
        salesCycle:
          $ref: '#/components/schemas/SalesCycle'
        winLossInfo:
          $ref: '#/components/schemas/WinLossInfo'
        opportunityLines:
          type: array
          description: Output only. Populated after the opportunity is accepted.
          items:
            $ref: '#/components/schemas/OpportunityLine'
        opportunityTeamMembers:
          type: array
          description: Output only. Populated after the opportunity is accepted.
          items:
            $ref: '#/components/schemas/OpportunityTeamMember'
        customerContacts:
          type: array
          description: Output only. Populated after the opportunity is accepted.
          items:
            $ref: '#/components/schemas/CustomerContact'
        rebateExtensions:
          type: array
          description: Output only.
          items:
            $ref: '#/components/schemas/RebateExtension'
        createTime:
          type: string
          format: date-time
          description: Output only. Timestamp when the opportunity was created.
        updateTime:
          type: string
          format: date-time
          description: Output only. Timestamp when the opportunity was last updated.
        referenceOpportunityId:
          type: string
          description: 'Output only. Opportunity ID in Google''s legacy Partner

            Advantage Portal. Useful for integrators reconciling Cloud

            Channel opportunities with records that originated in

            Partner Advantage; can be ignored by integrators that work

            only with Cloud Channel.'
        opportunityType:
          $ref: '#/components/schemas/OpportunityType'
        submitterEmail:
          type: string
          description: 'Optional. User email that created the opportunity through an

            integrator. Only used for integrator-created opportunities. Can

            only be set on create and cannot be edited thereafter.'
