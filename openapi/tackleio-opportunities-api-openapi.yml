            use this to keep each other up to date on selling activity.'
        nextStep:
          type: string
          maxLength: 255
          description: 'Optional. Only available for ISV opportunities. Summarizes the

            next step and who takes it.'
    OpportunityMetadata:
      type: object
      required:
      - id
      - companyName
      - createdDate
      - lastModifiedDate
      properties:
        id:
          type: string
          example: tackle-cosell-2jhD8b41CurTOqEsG2Soinublv3
        tackleInvitationId:
          type: string
          description: 'The Tackle identifier of the invitation this opportunity was created from, when the

            opportunity originated from an inbound AWS-led invitation. Absent on opportunities

            that were not created from an invitation.'
          example: tackle-invitation-2sKlF3xSRGx8M724Oy3fprAX51q
        companyName:
          type: string
          example: Example INC.
        createdDate:
          type: string
          example: '2024-08-19T15:30:20Z'
        lastModifiedDate:
          type: string
          example: '2024-08-19T16:00:08Z'
        pendingRequestIds:
          type: array
          items:
            type: string
          example:
          - 00123456789ABCDEFGHIJKL
        crmId:
          type: string
          example: 006ABCDEFGHIJK
        hubspotCrmId:
          type: string
          description: HubSpot Deal ID associated with this co-sell opportunity
          example: '12345678'
        crmOrgId:
          type: string
          description: The Salesforce organization identifier (org ID or alias) for the CRM org this opportunity's `crmId` belongs to.
          example: 00D5g000004uvWXYZ
        hasCloudErrors:
          type: boolean
          example: false
        hasSalesforceErrors:
          type: boolean
          example: false
        salesforceSyncError:
          type: string
          description: 'Most recent Salesforce sync error message, when the last sync attempt

            failed. Absent on opportunities where the last sync attempt succeeded.'
          example: 'INVALID_FIELD_FOR_INSERT_UPDATE: TackleCoSell__c: bad field names on insert/update call'
        archivedAt:
          type: string
          format: date-time
          description: Timestamp at which the opportunity was archived. Absent on non-archived opportunities.
        lastCRMSyncCloud:
          type: string
          format: date-time
          description: Timestamp of the last CRM sync attempt to the cloud (success or failure).
        lastCRMSyncCloudStatus:
          type: string
          description: 'Status of the most recent CRM-to-cloud sync attempt for this

            opportunity. Common values are `success` and `failed`. Absent on

            opportunities that have never been synced to the cloud.'
          example: success
        lastCRMSyncCloudSuccessful:
          type: string
          format: date-time
          description: Timestamp of the last successful CRM sync to the cloud; present only when the last sync succeeded.
        lastCRMSyncReceived:
          type: string
          format: date-time
          description: Timestamp of the last CRM sync received from the CRM (success or failure).
        lastCRMSyncReceivedStatus:
          type: string
          description: 'Status of the most recent CRM-to-Tackle inbound sync for this

            opportunity. Common values are `success` and `failed`. Absent on

            opportunities that have never received an inbound CRM update.'
          example: success
        lastCRMSyncReceivedChanges:
          type: object
          description: Map of field names to their changed values from the last CRM sync received.
          additionalProperties: true
    OpportunityHistoryEventActivityDetails:
      type: object
      description: 'Human-readable details about a history event, intended for

        display in opportunity audit trails.'
      properties:
        displayText:
          type: string
          description: Human-readable description of the operation.
          example: Opportunity submitted to cloud
        principal:
          $ref: '#/components/schemas/OpportunityHistoryEventPrincipal'
  parameters:
    opportunity_id:
      name: opportunity_id
      in: path
      required: true
      description: 'The Tackle identifier for the opportunity (for example, `tackle-cosell-2jhD8b41CurTOqEsG2Soinublv3`).

        This is the value returned in the `id` field of `listOpportunities` rows and in `metadata.id` on

        `getOpportunity`. The cloud-provider identifier (for example, `O123456`, returned in the response

        body''s top-level `id` field) is **not** accepted here.'
      schema:
        type: string
        example: tackle-cosell-2jhD8b41CurTOqEsG2Soinublv3
    OpportunityIdPath:
      name: id
      in: path
      required: true
      description: The Tackle-side opportunity identifier.
      schema:
        type: string
      example: tackle-cosell-2eWPPnWbbSaDFWqMaYoHMeWWY7T
    TackleOperationIdHeader:
      name: tackle-operation-id
      in: header
      required: false
      description: 'Narrows the effective operation on `POST /api/opportunities/{id}`.

        See the operation description for the accepted values and the

        permissions required for each. Create-only values

        (`createOpportunity`, `createDraftOpportunity`) are rejected with

        a `400 Bad Request` because creates must be sent to

        `POST /api/opportunities` instead.'
      schema:
        $ref: '#/components/schemas/TackleOperationIdUpdate'
  responses:
    Locked:
      description: 'Locked. The request was rejected because the vendor is currently in a mid-reset state

        (for example, while the vendor''s AWS Partner Central connection is being re-established).

        Retry the request once the vendor''s reset has completed.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Locked
    Conflict:
      description: 'Conflict. The request cannot be applied to the resource in its current state (for example,

        attempting `updateDraftOpportunity` on an opportunity that is no longer in draft state, or

        `createOpportunity` with a `crmId` that already maps to an existing co-sell opportunity).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Draft opportunity cannot be updated as it is not in draft state.
    NotFound:
      description: Not Found. No resource exists at the requested path for the authenticated vendor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Opportunity not found
    InternalServerError_2:
      description: 'An unexpected error occurred while processing the request.

        Retry idempotent reads after a short delay; for writes, check

        the opportunity history (`GET /api/opportunities/{id}/events`)

        before retrying to confirm whether the prior request was

        applied.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_2'
    Conflict_2:
      description: 'The request conflicts with existing state. For

        `createOpportunity` and `updateOpportunity`, this is returned

        when the supplied `$tkl-metadata.crm.id` is already linked to

        another co-sell opportunity for the same vendor.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_2'
    Unauthorized_2:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_2'
    NotFound_2:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_2'
    Locked_2:
      description: 'The vendor''s co-sell configuration is in the middle of a reset

        and cannot accept changes. Retry the request after a short

        delay; if the lock persists for more than a few minutes,

        contact Tackle support.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_2'
    BadRequest:
      description: 'Bad Request. The request was malformed or failed validation (for example, an invalid

        `sortField`/`sortOrder` value, an unsupported `tackle-operation-id`, or a request body that

        fails to parse as JSON).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Invalid sortField
    Forbidden:
      description: The caller is not authorized to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_2'
    Unauthorized:
      description: 'Unauthorized. The request did not include valid Tackle MTM bearer credentials, or the

        authenticated principal could not be resolved.'
    BadRequest_2:
      description: 'The request was malformed or failed validation. Common triggers

        include missing required fields, invalid enum values, type

        mismatches, an unrecognized `tackle-operation-id`, and (for

        create) `qualificationInfo.legalLanguageAccepted` not being

        `true`. The response `message` describes the specific

        violation.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_2'
    InternalServerError:
      description: 'Internal Server Error. An unexpected error occurred while processing the request. Response

        bodies for 5xx errors may be empty.'
  securitySchemes:
    tackleJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Tackle-issued JWT (interactive user or MTM token).
