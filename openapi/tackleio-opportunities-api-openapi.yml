      - CONFIRMED_NO_AUTHORITY_DECIDED
      - DONT_KNOW
      - CLEARLY_IDENTIFIED_PROCESS
      - VAGUE_UNDERSTANDING
    HistoryOperationId:
      type: string
      description: "Operation identifier stored on history events returned by\n`GET /api/opportunities/{id}/events`. Treated as a free-form\nstring on the wire: the documented values below cover the\ncommon cases, but additional operation strings may appear as\nnew history sources are added. Clients should fall back to\na default branch when displaying an unknown value.\n\nCommon values include every operation accepted on the\n`tackle-operation-id` header by the create and update\nendpoints (see `TackleOperationIdCreate` and\n`TackleOperationIdUpdate`) plus two service-emitted\noperations:\n\n- `internalUpdateEvent` — a Tackle metadata field on the\n  opportunity changed (for example, the attribute-syncing\n  subscription).\n- `cloudUpdateEvent` — the opportunity's cloud payload\n  (`cloudRaw`) was refreshed because Google Cloud Channel\n  sent a new snapshot.\n\nThese two service-emitted values are never accepted as\n`tackle-operation-id` headers; they appear only on history\nevents."
    TackleOperationIdUpdate:
      type: string
      description: 'Tackle-side operation identifier accepted on the

        `tackle-operation-id` header by `POST /api/opportunities/{id}`.

        The create-side values (`createOpportunity`,

        `createDraftOpportunity`) are explicitly rejected with a

        `400 Bad Request` — creates must be sent to

        `POST /api/opportunities` instead. Test-environment-only operations

        (`acceptOpportunity`, `rejectOpportunity`,

        `closeByAdminOpportunity`, `confirmCloseWonOpportunity`,

        `confirmCloseLostOpportunity`) are accepted only when the

        calling vendor is configured for use in a test environment;

        production vendors receive a `400 Bad Request` if they send

        these values. The remaining operations apply to every vendor.'
      enum:
      - updateOpportunity
      - updateDraftOpportunity
      - submitOpportunity
      - retryCreateOpportunity
      - closeWonOpportunity
      - closeLostOpportunity
      - acceptOpportunity
      - rejectOpportunity
      - closeByAdminOpportunity
      - confirmCloseWonOpportunity
      - confirmCloseLostOpportunity
    PartnerInfo:
      type: object
      description: Partner information populated after the opportunity is accepted.
      properties:
        incentiveEligibility:
          type: boolean
          description: Output only. Whether the partner is eligible for incentives.
        incentiveType:
          $ref: '#/components/schemas/IncentiveType'
        contractExpiryDate:
          $ref: '#/components/schemas/Date'
        rebateExpirationDate:
          $ref: '#/components/schemas/Date'
        distributor:
          type: string
          description: 'Distributor (for 2-tier deals). Format: `partners/{id}`.'
        subBillingAccountId:
          type: string
          description: Optional. Cloud Billing subaccount ID.
        extensionsCount:
          type: integer
          description: Output only. Number of extensions for rebate.
        gcpProjectNumbers:
          type: array
          description: Optional. Google Cloud project numbers. Numeric values only.
          items:
            type: string
        submitTime:
          type: string
          format: date-time
          description: Output only. Timestamp when the opportunity was last submitted.
        approveTime:
          type: string
          format: date-time
          description: Output only. Timestamp when the opportunity was approved.
        partnerViewType:
          $ref: '#/components/schemas/PartnerViewType'
    ProductFamily:
      type: string
      description: Product family that the opportunity belongs to.
      enum:
      - PRODUCT_FAMILY_UNSPECIFIED
      - GOOGLE_CLOUD_PLATFORM
      - GOOGLE_WORKSPACE
      - MAPS
      - CHROME
      - PSO
    Insights:
      type: object
      description: AWS-derived insights about the opportunity, populated by AWS Partner Central when available.
      properties:
        engagementScore:
          type: string
          description: 'AWS Partner Central engagement score for the opportunity, when

            provided. Common values include `Low`, `Medium`, and `High`;

            clients should treat unrecognized values as opaque.'
          example: High
        nextBestActions:
          type: string
          description: AWS-suggested next-best-action text for the opportunity, when provided.
    PhoneNumber:
      type: object
      description: 'Wire-format phone number. See

        https://github.com/google/libphonenumber.'
      properties:
        e164Number:
          type: string
          description: 'Phone number in ITU E.164 format, starting with `+`. For

            example `+15552220123`.'
          example: '+15552220123'
        shortCode:
          $ref: '#/components/schemas/PhoneNumberShortCode'
        extension:
          type: string
          description: Optional. The phone number's extension.
    OpportunityMetadata_2:
      type: object
      description: 'Tackle-specific metadata attached to every opportunity. Carried in

        the `$tkl-metadata` key of the payload.'
      properties:
        id:
          type: string
          description: The Tackle-side opportunity identifier.
          example: tackle-cosell-2eWPPnWbbSaDFWqMaYoHMeWWY7T
        companyName:
          type: string
          description: 'Convenience copy of the customer organization name,

            populated for list views and search. Updated whenever the

            underlying customer record changes; integrators that need

            the canonical name should read

            `customerInfo.customerDetails.organizationName`.'
        pendingRequestIds:
          type: array
          description: 'Request IDs for in-flight operations that have been queued

            but not yet applied to the cloud. Empty array when no

            requests are pending.'
          items:
            type: string
        crm:
          $ref: '#/components/schemas/OpportunityCRMInfo'
        cloudError:
          type: string
          description: 'The last cloud error encountered, cleared on the next

            successful request. Absent when no error has been recorded.'
        hasCloudErrors:
          type: boolean
          description: 'True when the opportunity has unresolved cloud-side errors —

            that is, the most recent cloud operation failed and no

            subsequent successful operation has cleared the error.'
        archivedAt:
          type: string
          format: date-time
          description: 'Timestamp when the opportunity was archived in Tackle; absent

            otherwise.'
        hasSalesforceErrors:
          type: boolean
          description: 'True when the opportunity has unresolved Salesforce-sync

            errors — that is, the most recent sync attempt failed and

            no subsequent successful sync has cleared the error.'
        salesforceSyncError:
          type: string
          description: 'The last Salesforce sync error, if any. Absent when no

            error has been recorded.'
        dataMapperToken:
          type: string
          description: 'Write-only. Token issued by Tackle''s Data Mapper feature

            (the Tackle product that imports opportunity data from

            external systems and keeps selected fields in sync over

            time). When provided on create, the new opportunity is

            subscribed to ongoing attribute syncing from the source

            data set the token references. Integrators not using Data

            Mapper can omit this field.'
        attributeSyncing:
          $ref: '#/components/schemas/OpportunityAttributeSyncing'
        created:
          type: string
          format: date-time
          description: Timestamp when the opportunity was created in Tackle.
        lastModified:
          type: string
          format: date-time
          description: Timestamp when the opportunity was last modified in Tackle.
    ContractVehicle:
