          $ref: '#/components/schemas/Budget'
        authority:
          $ref: '#/components/schemas/Authority'
        need:
          $ref: '#/components/schemas/Need'
        timeline:
          $ref: '#/components/schemas/Timeline'
        campaignCode:
          type: string
          description: 'Optional. Active campaign name (issued by Google) for the

            selected region and product. Campaign names are not

            published in this API; check with your Google partner

            contact for the valid values for your region and product

            mix.'
        msspDeal:
          type: boolean
          description: 'Optional. Flag to highlight if the partner will also act as

            MSSP (Managed Security Service Provider).'
        legalLanguageAccepted:
          type: boolean
          description: 'Required. Must be `true` for the opportunity to be created.

            Cannot be edited after the opportunity is accepted.'
        decisionPhase:
          $ref: '#/components/schemas/DecisionPhase'
        publicTenderAttestation:
          type: boolean
          description: 'Required for public-sector opportunities (`publicSector:

            true`); optional otherwise. Set to `true` to attest that

            the opportunity meets public-tender requirements.'
    PartnerReadyToClose:
      type: string
      description: 'Partner ready-to-close indicator. Can be edited after the

        opportunity is accepted. Setting to `MIGRATION_IMPL` corresponds

        to Closed/Won; setting to `CLOSED_LOST` corresponds to Closed/Lost.'
      enum:
      - PARTNER_CLOSE_STAGE_UNSPECIFIED
      - MIGRATION_IMPL
      - CLOSED_LOST
    Marketing:
      type: object
      properties:
        awsFundingUsed:
          type: string
