          description: CRM-side opportunity identifier.
          example: 006fJ000000qVvoQAE
        orgId:
          type: string
          nullable: true
          description: CRM-side organization identifier.
    OperationType:
      type: string
      description: "Transaction type for the opportunity:\n\n- `OPERATION_TYPE_UNSPECIFIED` — placeholder default; should\n  not be sent on create.\n- `NEW` — net-new transaction with a new customer.\n- `RENEWAL` — renewal of an existing subscription.\n- `ADD_ON` — additional purchase on an existing customer.\n- `EXPANSION` — expansion of an existing subscription\n  (for example, more seats)."
      enum:
      - OPERATION_TYPE_UNSPECIFIED
      - NEW
      - RENEWAL
      - ADD_ON
      - EXPANSION
    UpdateOpportunityRequest:
      allOf:
      - $ref: '#/components/schemas/Opportunity_2'
      description: 'Tackle-shaped opportunity payload for update. Only the fields the

        caller wants to change need to be present; the server merges with

        the existing opportunity. The opportunity `name` is immutable and

        is always overridden by the server with the stored value.'
