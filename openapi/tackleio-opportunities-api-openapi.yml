      properties:
        givenName:
          type: string
          description: Output only. Given (first) name of the contact.
        familyName:
          type: string
          description: Output only. Family (last) name of the contact.
        title:
          type: string
          description: Output only. Job title at the customer organization.
        role:
          $ref: '#/components/schemas/Role'
        primary:
          type: boolean
          description: 'Output only. True when this contact is marked as the

            primary contact for the customer.'
    QualificationInfo:
      type: object
      description: Qualification information for the opportunity.
      properties:
        dealNumber:
          type: string
          description: Output only. System-generated unique deal identifier.
          example: DR-ABC123DEF456GH
        operationType:
          $ref: '#/components/schemas/OperationType'
        contractLengthMonths:
          type: integer
          description: Required. Contract terms in months.
        quantity:
          type: integer
          description: Optional. Number of seats or licenses. Default `1`.
        dealSize:
          $ref: '#/components/schemas/Money'
        estimatedCloseDate:
          $ref: '#/components/schemas/Date'
        publicSector:
          type: boolean
          description: 'Optional. Whether the customer is a public sector organization

            that requires competing offers from multiple vendors.'
