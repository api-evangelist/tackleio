  /api/opportunities/{id}:
    parameters:
    - $ref: '#/components/parameters/OpportunityIdPath'
    get:
      operationId: getOpportunity
      summary: Get an opportunity by ID
      description: 'Returns the full Tackle-shaped opportunity including

        `$tkl-metadata` and the latest cached Cloud Channel payload.


        Requires the `cosell:GetOpportunity` permission.'
      tags:
      - Opportunities
      responses:
        '200':
          description: The opportunity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity_2'
        '400':
          $ref: '#/components/responses/BadRequest_2'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound_2'
        '500':
          $ref: '#/components/responses/InternalServerError_2'
    post:
      operationId: updateOpportunity
      summary: Update an opportunity
      description: "Queues a partial update against the Cloud Channel API. The exact\nbehavior depends on `tackle-operation-id`:\n\n- `updateOpportunity` (default): requires `cosell:UpdateOpportunity`.\n  If the resulting state transitions the opportunity to `SUBMITTED`\n  (from anything other than `SUBMITTED`), `cosell:StartEngagement`\n  is additionally required and the effective operation is treated\n  as `submitOpportunity`.\n- `updateDraftOpportunity`: requires\n  `cosell:UpdateOpportunity`.\n- `submitOpportunity`: forces `state` to `SUBMITTED`; requires\n  `cosell:StartEngagement`.\n- `closeWonOpportunity` / `closeLostOpportunity`: request a close;\n  requires `cosell:UpdateOpportunity`.\n- `retryCreateOpportunity`: requeue a create that previously\n  failed; requires `cosell:UpdateOpportunity` and\n  `legalLanguageAccepted: true`.\n- Test-environment-only:\n  `acceptOpportunity`, `rejectOpportunity`,\n  `closeByAdminOpportunity`, `confirmCloseWonOpportunity`,\n  `confirmCloseLostOpportunity`. These simulate Google-side actions\n  and attribute the resulting history event to Google.\n\nThe response returns a `requestId` identifying the enqueued cloud\noperation; poll `GET /api/opportunities/{id}/events` or\n`GET /api/opportunities/{id}` to observe the outcome."
      tags:
      - Opportunities
      parameters:
      - $ref: '#/components/parameters/TackleOperationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOpportunityRequest'
      responses:
        '202':
          description: Update request enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOpportunityResponse'
        '400':
          $ref: '#/components/responses/BadRequest_2'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound_2'
        '409':
          $ref: '#/components/responses/Conflict_2'
        '423':
          $ref: '#/components/responses/Locked_2'
        '500':
          $ref: '#/components/responses/InternalServerError_2'
  /api/opportunities/{id}/events:
    parameters:
    - $ref: '#/components/parameters/OpportunityIdPath'
    get:
      operationId: listOpportunityHistory
      summary: List the event history for an opportunity
      description: 'Returns a page of history events for an opportunity. Each event

        has an `operation` field identifying what produced it; the

        documented operations include the values an integrator can

        submit on the `tackle-operation-id` header, plus two

        service-emitted operations (`internalUpdateEvent`,

        `cloudUpdateEvent`) — see `HistoryOperationId` for the full

        catalog. Treat the field as a free-form string and fall back to

        a default branch when displaying an unknown value.


        Unknown opportunity IDs return `200` with an empty `events`

        array — this endpoint does not distinguish "no events" from

        "no such opportunity." This behavior is asymmetric with

        `GET /api/opportunities/{id}`, which returns `404` for unknown

        IDs.


        Requires the `cosell:ListOpportunityEvents` permission.'
      tags:
      - Opportunities
      parameters:
      - name: limit
        in: query
        description: 'Maximum number of events to return. Values above 25 are

          silently clamped to 25. When omitted (or `0`), the server does

          not apply a per-page item limit; the page is bounded only by an internal response size limit and may include many

          more than 25 events. Pass an explicit `limit` for predictable

          page sizes and use the returned `next` token to paginate.'
        schema:
          type: integer
          minimum: 0
          maximum: 25
      - name: next
        in: query
        description: 'Opaque continuation token returned by a previous call.

          Pass it back unmodified to fetch the next page. The token

          is opaque; do not rely on its internal format (malformed

          tokens surface as `500 Internal Server Error` rather than

          `400 Bad Request`, so always pass back the token from a

          prior response unmodified).'
        schema:
          type: string
      responses:
        '200':
          description: 'A page of events. Returned with an empty `events` array

            when the supplied opportunity ID does not exist for the

            authenticated vendor.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOpportunityHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest_2'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError_2'
components:
  schemas:
    Need:
      type: string
      description: Need qualification.
      enum:
      - NEED_UNSPECIFIED
      - CLEAR_NEED
      - COMPELLING_NEED
      - NO_NEED
    ListOpportunitiesResponse:
      type: object
      properties:
        opportunities:
          type: array
          items:
            $ref: '#/components/schemas/ListOpportunitiesResponseItem'
        total:
          description: The total number of opportunities that matches the filter criteria.
          type: integer
          example: 100
        currentPageCount:
          description: The number of opportunities returned in the current page.
          type: integer
          example: 10
        isNextPage:
          description: A boolean value indicating if there are more opportunities to be fetched.
          type: boolean
          example: true
        nextIndex:
          description: The starting index to use for fetching the next page of opportunities. Only present when `isNextPage` is `true`.
          type: integer
          example: 10
    OpportunityHistoryEventPrincipal:
      type: object
      description: 'Actor attribution for a history event. For test-environment-only

        operations (`acceptOpportunity`, `rejectOpportunity`,

        `closeByAdminOpportunity`, `confirmCloseWonOpportunity`,

        `confirmCloseLostOpportunity`) the principal is set to a

        Google placeholder so that the resulting event renders as

        Google-attributed in opportunity audit trails.'
      properties:
        id:
          type: string
          description: 'Stable identifier for the principal (for example, a Tackle

            user ID, integrator service-account ID, or Google sales

            user ID).'
        type:
          type: string
          description: 'Principal kind. Common values include `user`, `integrator`,

            `cloud`, and `internal`. Treat as a free-form string and

            fall back to a default branch when displaying an unknown

            value.'
        givenName:
          type: string
          description: 'Given (first) name of the principal, when known. May be

            absent for non-human principals.'
        familyName:
          type: string
          description: 'Family (last) name of the principal, when known. May be

            absent for non-human principals.'
        pictureUrl:
          type: string
          format: uri
          description: Optional URL of the principal's avatar image.
        email:
          type: string
          format: email
          description: Email of the principal, when known.
    RebateExtension:
      type: object
      description: Rebate extension. Output only.
      properties:
        requestNumber:
          type: string
          description: Output only. Extension request number.
        extensionReason:
          $ref: '#/components/schemas/ExtensionReason'
        extensionStatus:
          $ref: '#/components/schemas/ExtensionStatus'
        extensionRejectionReason:
          $ref: '#/components/schemas/ExtensionRejectionReason'
        comments:
          type: string
          description: 'Output only. Free-form comments associated with the

            extension request.'
    Money:
      type: object
      description: 'An amount of money with its currency type. The whole `Money`

        object is replaced atomically when included on update — there is

        no per-field merge of `currencyCode`, `units`, or `nanos`.'
      properties:
        currencyCode:
          type: string
          description: Three-letter ISO 4217 currency code.
          example: USD
        units:
          type: string
          description: 'Whole units of the amount, encoded as a string. For example,

            `1500000` with `currencyCode: USD` and `nanos: 0` is

            $1,500,000.00 USD.'
          example: '1500000'
        nanos:
          type: integer
          description: 'Sub-unit (nano) part of the amount. One unit equals 10^9

            nanos; for example, `nanos: 750000000` represents 0.75 of

            one unit. Must have the same sign as `units`.'
    Error:
      type: object
      description: 'Error envelope returned for typed error responses. Some 4xx and 5xx responses

        (such as direct `Unauthorized` and `Internal Server Error` responses) may instead

        return an empty body; consumers should be tolerant of that.'
      properties:
        message:
          type: string
          description: A short, human-readable description of the error.
          example: Opportunity not found
    PhoneNumberShortCode:
      type: object
      description: A short code — region-restricted phone number.
      properties:
        regionCode:
          type: string
          description: 'Required. ISO 3166-1 alpha-2 country code (also known as the

            CLDR region code).'
          example: US
        number:
          type: string
          description: Required. The short code digits.
          example: '611'
    OpportunityLine:
      type: object
      description: Opportunity line item. Output only.
      properties:
        displayName:
          type: string
          description: Output only. Display name of the line item.
        quantity:
          type: integer
          description: Output only. Number of units on the line item.
        salesPrice:
          $ref: '#/components/schemas/Money'
        listPrice:
          $ref: '#/components/schemas/Money'
        totalPrice:
          $ref: '#/components/schemas/Money'
        metric:
          type: string
          description: 'Output only. Unit of measure for `quantity` (for example,

            `seats`, `licenses`, `gigabytes`).'
        description:
          type: string
          description: Output only. Free-form description of the line item.
    Date:
      type: object
      description: 'A calendar date. Any field may be zero to represent a partial

        date (for example, `year: 2026, month: 0, day: 0` for "sometime

        in 2026"). The whole `Date` object is replaced atomically when

        included on update — there is no per-field merge.'
      properties:
        year:
          type: integer
          description: Year (1–9999), or 0 to specify a date without a year.
        month:
          type: integer
          description: Month (1–12), or 0 to specify a year without a month and day.
        day:
          type: integer
          description: 'Day (1–31, valid for year+month), or 0 to specify year, or

            year + month.'
    UpdateOpportunityResponse:
      type: object
      required:
      - requestId
      properties:
        requestId:
          type: string
          description: 'Identifier for the enqueued cloud operation. Matches the

            `eventID` reported on subsequent history events.'
          example: 2uRzjsNKpJBs6qsxT5L2S1UMXnj
    PostalAddress:
      type: object
      description: 'A structured postal address compatible with Google''s address

        formatting model. For most regions, populate `regionCode`,

        `addressLines`, `locality`, and `postalCode`; the remaining

        fields cover country-specific cases (for example,

        `administrativeArea` for state or province; `sortingCode` for

        country-specific sorting codes such as France''s CEDEX). See

        https://support.google.com/business/answer/6397478 for

        country-by-country guidance on which fields are required.'
      properties:
        revision:
          type: integer
          description: Schema revision number. Always send `0`.
        regionCode:
          type: string
          description: 'Required. ISO 3166-1 alpha-2 country code (also known as the

            CLDR region code), for example `US`, `GB`, `DE`.'
          example: US
        languageCode:
          type: string
          description: 'Optional. BCP-47 language tag for the address (for example,

            `en-US`, `de-DE`). Used to disambiguate locale-specific

            formatting.'
        postalCode:
          type: string
          description: Optional. Postal or ZIP code.
        sortingCode:
          type: string
          description: 'Optional. Country-specific sorting code (for example, CEDEX

            in France). Most regions do not use this field.'
        administrativeArea:
          type: string
          description: 'Optional. Largest administrative subdivision below the

            country level (for example, state, province, or region).'
        locality:
          type: string
          description: Optional. City or town.
        sublocality:
          type: string
          description: 'Optional. Smaller administrative subdivision below

            `locality` (for example, neighborhood or district).'
        addressLines:
          type: array
          description: 'Optional. Street-address lines (street and number, suite or

            unit). Order is preserved as-rendered.'
          items:
            type: string
        recipients:
          type: array
          description: Optional. Recipient name(s) at this address.
          items:
            type: string
        organization:
          type: string
          description: Optional. Organization name at this address.
    OpportunityHistoryEventCloudRequest:
      type: object
      description: 'One Google Cloud Channel call made on behalf of an opportunity

        history event. A single event may include multiple cloud

        requests (for example, when a sub-flow chains calls).'
      required:
      - requestID
      - operation
      - timestamp
      properties:
        requestID:
          type: string
          description: 'Identifier for the cloud-side request, useful for support

            correlation. Equal to the `eventID` of the parent history

            event for top-level requests.'
        operation:
          type: string
          description: 'Cloud Channel operation name (for example,

            `opportunities.create`, `opportunities.patch`).'
        timestamp:
          type: string
          format: date-time
          description: Time the cloud request was issued.
        request:
          description: 'The raw request payload sent to Google Cloud Channel.

            Shape mirrors the cloud''s v1alpha1 schema.'
          nullable: true
    OpportunityHistoryEvent:
      type: object
      required:
      - operation
      - eventID
      - created
      - lastModified
      properties:
        operation:
          description: 'The operation that produced this history event. See

            `HistoryOperationId` for the common set of values, but

            treat this field as a free-form string: additional

            operation strings beyond the documented catalog may

            appear. Clients should fall back to a default branch

            when displaying an unknown value.'
          allOf:
          - $ref: '#/components/schemas/HistoryOperationId'
        eventID:
          type: string
          description: 'Unique identifier for the history event. Equal in value to

            the `requestId` returned by the create or update response

            that produced the event; the two schema families use

            different casing on the wire (`eventID` here, `requestId`

            on the response body) but carry the same identifier.'
          example: 2uRzjsNKpJBs6qsxT5L2S1UMXnj
        status:
          type: string
          description: 'Status of the event. Omitted from the response body for

            instantaneous history items that have no async lifecycle.'
          enum:
          - pending
          - in-progress
          - retrying
          - successful
          - failed
        rawRequest:
          description: The original Tackle-shaped request that produced this event.
          nullable: true
        cloudRaw:
          description: Raw cloud payload, if any, associated with this event.
          nullable: true
        cloudRequests:
          type: array
          items:
            $ref: '#/components/schemas/OpportunityHistoryEventCloudRequest'
        cloudResponses:
          type: array
          items:
            $ref: '#/components/schemas/OpportunityHistoryEventCloudResponse'
        activityDetails:
          $ref: '#/components/schemas/OpportunityHistoryEventActivityDetails'
        created:
          type: string
          format: date-time
          description: Timestamp the event was created (RFC 3339 Nano).
        lastModified:
          type: string
          format: date-time
          description: Timestamp the event was last updated (RFC 3339 Nano).
    OpportunityInfo:
      type: object
      description: Contains details about the opportunity.
      properties:
        partnerEntity:
          type: string
          description: 'Required. Partner who sources the deal. For 2-tier partners

            this is the distributor ID. Format: `partners/{id}`.'
          example: partners/1234567890
        indirectPartnerEntity:
          type: string
          description: 'Optional. For 2-tier deals, the indirect reseller. Format:

            `partners/{id}`.'
        displayName:
          type: string
          maxLength: 120
          description: Optional. Display name for the opportunity.
        description:
          type: string
          description: Optional. Opportunity description.
        productFamily:
          type: array
          description: Product Family. Required for ISV Solution Connect Opportunity.
          items:
            $ref: '#/components/schemas/ProductFamily'
        productCategory:
          type: array
          description: Product Category. Required for non-ISV opportunities.
          items:
            $ref: '#/components/schemas/ProductCategory'
        confidential:
          type: boolean
          description: 'Optional. Flag to identify if the opportunity is confidential.

            Default `false`.'
        gcpWatermark:
          type: number
          format: double
          description: 'Output only. Google-side scoring or eligibility watermark

            for the opportunity. Provided as a numeric value; check

            with your Google partner contact for current scoring

            semantics.'
        opportunityAmount:
          $ref: '#/components/schemas/Money'
    OpportunityResponse:
      allOf:
      - $ref: '#/components/schemas/Opportunity'
      type: object
      properties:
        nationalSecurity:
          type: string
          description: 'Whether the opportunity is for a national-security or government

            customer that AWS Partner Central treats as restricted. Submit `Yes`

            for national-security workloads (which routes the opportunity through

            AWS''s restricted review path) and `No` otherwise.'
          enum:
          - 'No'
          - 'Yes'
        createdDate:
          type: string
        id:
          type: string
          description: 'The AWS Partner Central opportunity identifier (for example,

            `O123456`). This is the cloud-provider identifier, not the Tackle

            identifier — to look this opportunity up in Tackle, use

            `metadata.id` (`tackle-cosell-...`).'
          example: O123456
        lastModifiedDate:
          type: string
        source:
          type: string
          enum:
          - Inbound
          - Outbound
        partnerOpportunityIdentifier:
          type: string
          example: tackle-cosell-2jhD8b41CurTOqEsG2Soinublv3
        opportunityTeam:
          description: 'Partner-side contacts assigned to this opportunity. For the AWS-side

            opportunity team (AWS sales reps, partner-development managers, etc.),

            see `awsOpportunitySummary.opportunityTeam`.'
          $ref: '#/components/schemas/Contacts'
        metadata:
          $ref: '#/components/schemas/OpportunityMetadata'
        awsOpportunitySummary:
          type: object
          description: 'The AWS Partner Central view of this opportunity, returned only after

            AWS has populated cloud-side data for the record. This is the AWS-side

            snapshot — including AWS-assigned engagement details, AWS opportunity

            team contacts, and AWS-derived insights — and may differ from the

            partner-supplied fields outside this object until AWS finishes

            processing the most recent change.'
          properties:
            catalog:
              type: string
              description: 'Which AWS Partner Central catalog this opportunity belongs to. `AWS`

                is the production catalog; `Sandbox` is the AWS Partner Central

                sandbox catalog used for AWS-side integration testing. Sandbox

                opportunities are isolated from production data.'
              enum:
              - Sandbox
              - AWS
            customer:
              type: object
              properties:
                contacts:
                  $ref: '#/components/schemas/Contacts'
            insights:
              $ref: '#/components/schemas/Insights'
            involvementType:
              type: string
              description: 'How AWS will be involved in this opportunity. `Co-Sell` engages an AWS

                seller to actively partner on the deal; `For Visibility Only` reports

                the deal to AWS without engaging an AWS seller.'
              enum:
              - Co-Sell
              - For Visibility Only
            involvementTypeChangeReason:
              type: string
              description: 'Reason supplied when `involvementType` is changed for this opportunity

                (for example, when a `For Visibility Only` opportunity is upgraded to

                `Co-Sell` after qualification, or when an opportunity''s involvement

                level is adjusted in response to deal changes).'
              enum:
              - Expansion Opportunity
              - Change in Deal Information
              - Customer Requested
              - Technical Complexity
              - Risk Mitigation
            lifeCycle:
              type: object
              properties:
                closedLostReason:
                  type: string
                  description: 'Reason the opportunity was closed lost, when `stage` is

                    `Closed Lost`. Absent on opportunities still in active stages.

                    AWS Partner Central accepts a broad set of values here; treat

                    unrecognized values as opaque.'
                  enum:
                  - Administrative
                  - Business Associate Agreement
                  - Company Acquired/Dissolved
                  - Competitive Offering
                  - Customer Data Requirement
                  - Customer Deficiency
                  - Customer Experience
                  - Delay / Cancellation of Project
                  - Duplicate
                  - Duplicate Opportunity
                  - Executive Blocker
                  - Failed Vetting
                  - Feature Limitation
                  - Financial/Commercial
                  - Insufficient Amazon Value
                  - Insufficient AWS Value
                  - International Constraints
                  - Legal / Tax / Regulatory
                  - Legal Terms and Conditions
                  - Lost to Competitor
                  - Lost to Competitor - Google
                  - Lost to Competitor - Microsoft
                  - Lost to Competitor - Other
                  - Lost to Competitor - Rackspace
                  - Lost to Competitor - SoftLayer
                  - Lost to Competitor - VMWare
                  - No Customer Reference
                  - No Integration Resources
                  - No Opportunity
                  - No Perceived Value of MP
                  - No Response
                  - Not Committed to AWS
                  - No Update
                  - On Premises Deployment
                  - Other
                  - Other (Details in Description)
                  - Partner Gap
                  - Past Due
                  - People/Relationship/Governance
                  - Platform Technology Limitation
                  - Preference for Competitor
                  - Price
                  - Product/Technology
                  - Product Not on AWS
                  - Security / Compliance
                  - Self-Service
                  - Technical Limitations
                  - Term Sheet Impasse
                nextSteps:
                  type: string
                stage:
                  type: string
                  description: 'AWS Partner Central sales-stage value for this opportunity.

                    Spans the full AWS-side lifecycle from initial discovery

                    (`Not Started`, `In Progress`, `Prospect`) through

                    qualification (`Qualify`, `Engaged`), evaluation (`Technical

                    Validation`, `Business Validation`), to outcome (`Launched`,

                    `Closed Lost`, `Closed Incomplete`). The set of stages may

                    expand over time; treat unrecognized values as opaque.'
                  enum:
                  - Not Started
                  - In Progress
                  - Prospect
                  - Engaged
                  - Identified
                  - Qualify
                  - Research
                  - Seller Engaged
                  - Evaluating
                  - Seller Registered
                  - Term Sheet Negotiation
                  - Contract Negotiation
                  - Onboarding
                  - Building Integration
                  - Qualified
                  - On-hold
                  - Technical Validation
                  - Business Validation
                  - Committed
                  - Launched
                  - Deferred to Partner
                  - Closed Lost
                  - Completed
                  - Closed Incomplete
                targetCloseDate:
                  type: string
                nextStepsHistory:
                  type: array
                  items:
                    type: object
                    properties:
                      time:
                        type: string
                      value:
                        type: string
            opportunityTeam:
              type: array
              description: 'The AWS-side opportunity team. Returned as an array with one entry per

                AWS principal involved.'
              items:
                $ref: '#/components/schemas/AwsOpportunityTeam'
            origin:
              type: string
              enum:
              - Partner Referral
              - AWS Referral
            project:
              type: object
              properties:
                expectedCustomerSpend:
                  type: array
                  items:
                    type: object
                    properties:
                      amount:
                        type: string
                        description: Stringified decimal amount; returned as a string to preserve precision.
                      currencyCode:
                        type: string
                      frequency:
                        type: string
                        enum:
                        - Monthly
                      targetCompany:
                        type: string
            relatedEntityIds:
              type: object
              description: Identifiers for entities related to the opportunity, such as AWS products and solutions.
              properties:
                awsProducts:
                  type: array
                  items:
                    type: string
                  description: Array of AWS product identifiers associated with the opportunity.
                solutions:
                  type: array
                  items:
                    type: string
                  description: Array of solution identifiers associated with the opportunity.
            relatedOpportunityId:
              type: string
            visibility:
              type: string
              enum:
              - Full
              - Limited
    SoftwareRevenue:
      type: object
      properties:
        deliveryModel:
          type: string
          enum:
          - Contract
          - Pay-as-you-go
          - Subscription
        effectiveDate:
          type: string
        expirationDate:
          type: string
        value:
          type: object
          properties:
