          - 'No'
          - 'Yes'
        campaignName:
          type: string
        channels:
          type: array
          items:
            type: string
        source:
          type: string
          description: 'AWS Partner Central marketing source for the opportunity. Common values

            include `None`, `Marketing Activity`, and `Other`; treat unrecognized

            values as opaque.'
          example: None
        useCases:
          type: array
          items:
            type: string
    Opportunity:
      type: object
      properties:
        nationalSecurity:
          type: string
          description: 'Whether the opportunity is for a national-security or government

            customer that AWS Partner Central treats as restricted. Submit `Yes`

            for national-security workloads (which routes the opportunity through

            AWS''s restricted review path) and `No` otherwise.'
          enum:
          - 'No'
          - 'Yes'
        customer:
          $ref: '#/components/schemas/Customer'
        lifeCycle:
          $ref: '#/components/schemas/LifeCycle'
        marketing:
          $ref: '#/components/schemas/Marketing'
        opportunityType:
          type: string
          enum:
          - Net New Business
          - Expansion
          - Flat Renewal
        primaryNeedsFromAws:
          type: array
          items:
            type: string
            enum:
            - Co-Sell - Architectural Validation
            - Co-Sell - Business Presentation
            - Co-Sell - Competitive Information
            - Co-Sell - Pricing Assistance
            - Co-Sell - Technical Consultation
            - Co-Sell - Total Cost of Ownership Evaluation
            - Co-Sell - Deal Support
            - Co-Sell - Support for Public Tender / RFx
        project:
          $ref: '#/components/schemas/Project'
        softwareRevenue:
          $ref: '#/components/schemas/SoftwareRevenue'
        solutions:
          type: array
          items:
            type: string
        awsMarketplaceOffers:
          type: array
          items:
            type: string
          description: Array of AWS Marketplace offer identifiers associated with the opportunity.
        awsProducts:
          type: array
          items:
            type: string
          description: 'Array of AWS product identifiers associated with the opportunity. These represent AWS services

            or products that are part of the customer''s solution (e.g., AmazonBedrock, AmazonS3, AmazonEC2Trn2).'
        dataMapper:
          $ref: '#/components/schemas/DataMapper'
    OpportunityHistoryEventCloudResponse:
      type: object
      description: 'The Google Cloud Channel response received for a corresponding

        `OpportunityHistoryEventCloudRequest`.'
      required:
      - operation
      - timestamp
      properties:
        requestID:
          type: string
          description: 'Cloud-side request identifier this response corresponds to.

            Matches the `requestID` of the paired

            `OpportunityHistoryEventCloudRequest`.'
        operation:
          type: string
          description: Cloud Channel operation name that was invoked.
        timestamp:
          type: string
          format: date-time
          description: Time the cloud response was received.
        response:
          description: 'The raw response payload received from Google Cloud Channel.

            Shape mirrors the cloud''s v1alpha1 schema.'
          nullable: true
        error:
          type: string
          description: 'Cloud-side error message when the response represents a

            failure. Omitted on success.'
    Contact:
      type: object
      description: Contact details.
      properties:
        givenName:
          type: string
