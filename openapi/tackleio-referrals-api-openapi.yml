components:
  schemas:
    TrackingInfo:
      type: object
      description: 'Microsoft Partner Center tracking identifiers attached to the

        referral. Most fields are populated by Microsoft and reflect

        upstream tracking state; expect any field to be omitted when

        Microsoft has not assigned a value.'
      properties:
        microsoftMsxId:
          type: string
          description: Microsoft Sales Experience (MSX) identifier for the linked Dynamics 365 opportunity, when present.
        microsoftUSFedOpportunityId:
          type: string
          description: 'Microsoft US Federal opportunity identifier, populated only for US-Federal referrals (`dealSensitivity: USFed`).'
        microsoftUSFedLeadId:
          type: string
          description: 'Microsoft US Federal lead identifier, populated only for US-Federal referrals (`dealSensitivity: USFed`).'
        migratedPSCDealId:
          type: string
          description: Legacy Partner Sales Connect (PSC) deal ID preserved on referrals migrated from PSC.
        migratedPSCPartnerDealId:
          type: string
          description: Legacy Partner Sales Connect (PSC) partner-deal ID preserved on referrals migrated from PSC.
        leadToOpportunityLinkId:
          type: string
          description: Microsoft Partner Center linkage ID joining a lead-stage referral to its converted opportunity.
        microsoftMilestoneIds:
          type: array
          description: Microsoft-side milestone identifiers associated with the referral lifecycle. Treat as opaque values.
          items:
            type: string
    Link:
      type: object
      description: HATEOAS-style link surfaced by Microsoft Partner Center for follow-up navigation. Useful when integrating the Microsoft Partner Center UI side-by-side with a Tackle-driven flow; not required to operate this API.
      properties:
        uri:
          type: string
          description: The URI of the related resource.
        method:
          type: string
          description: The HTTP method to use when following the link.
          example: GET
    SolutionInput:
      type: object
      properties:
        type:
          type: string
          description: The type of solution. The only currently emitted value for IP is "Name".
          enum:
          - Name
        id:
          type: string
          description: 'Identifier for the solution. For Microsoft first-party solutions, use `identifiers.id` from the Microsoft solutions response (`type: solution`); for owned or third-party solutions, use `solutionId` from the solution lookup.'
        name:
          type: string
          description: Name of the solution. Use `name` from the solution lookup.
        price:
          type: string
          description: Price of the solution. Caller-supplied for Microsoft first-party (`1P`) solutions; ignored otherwise.
        quantity:
          type: integer
          description: Quantity of the solution. Caller-supplied for Microsoft first-party (`1P`) solutions; ignored otherwise.
        currency:
          type: string
          description: ISO 4217 currency code. Caller-supplied for Microsoft first-party (`1P`) solutions; ignored otherwise.
        solutionType:
          type: string
          description: The type of solution.  Possible types are 1P, 3P, and SA. type from solution lookup.
          enum:
          - 1P
          - 3P
          - SA
        publisherName:
          type: string
          description: The solution publishers organization name.  publisherName from solution lookup.
      required:
      - type
      - id
      - name
      - solutionType
      - publisherName
    AddressInput:
      type: object
      description: Customer address used when creating a referral.
      properties:
        addressLine1:
          type: string
          description: 'Street address (line 1). When the customer was matched via

            `customerLookup`, copy `customerAccountDetails.address1_line1`;

            for DUNS-matched customers, copy `address.addressLine1` from

            the DUNS lookup.'
        city:
          type: string
          description: 'City. When the customer was matched via `customerLookup`,

            copy `customerAccountDetails.address1_city`; for DUNS-matched

            customers, copy `address.city` from the DUNS lookup.'
        postalCode:
          type: string
          description: 'Postal code. Required only when sourced from a DUNS lookup

            (use `address.postalCode` from that response); ignored when

            sourced from `customerLookup`.'
        country:
          type: string
          description: 'Country in ISO 3166-1 alpha-2 form (see

            [ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2)).

            When the customer was matched via `customerLookup`, convert

            `customerAccountDetails.address1_country` (e.g. "United

            States") to its 2-letter code (`US`); for DUNS-matched

            customers, copy `address.country` from the DUNS lookup.'
        region:
          type: string
          description: 'Region. Required only when sourced from a DUNS lookup (use

            `address.region` from that response); ignored when sourced

            from `customerLookup`.'
      required:
      - addressLine1
      - country
    InviteContextInput:
      type: object
      description: 'Information supplied when inviting another organization into a

        co-sell engagement. Each entry in `inviteContexts` invites one

        organization (Microsoft or a partner). Use the literal

        `organizationId: "msft"` to invite Microsoft; use values returned

        by `partnerLookup` to invite other partners.'
      properties:
        organizationId:
          type: string
          description: The ID of the organization being invited to participate.  “msft” for Microsoft, organizationId from partner lookup for other partners.
        organizationName:
          type: string
          description: The name of the organization being invited to participate.  “Microsoft” for Microsoft, name from partner lookup for other partners.
        notes:
          type: string
          description: Notes shared with the receiving organization. Optional, may be AI-generated for Microsoft invitees and is typically user-entered for partner invitees.
        assistanceRequestCode:
          type: string
          description: "Category describing the kind of assistance requested from the\ninvited organization. Used by Microsoft to route the engagement\nto the right team. Allowed values:\n\n  - `GeneralOrOther` — request that does not fit a more specific\n    category.\n  - `CustomerTechnicalArchitecture` — help designing the\n    customer's technical architecture.\n  - `ProofOfConceptOrDemo` — assistance running a proof of\n    concept or product demo.\n  - `QuotesOrLicensing` — assistance with pricing, quoting, or\n    licensing.\n  - `PostSalesCustomerSuccess` — post-sale customer-success\n    engagement.\n  - `WorkloadSpecificValueProposition` — help building or\n    articulating a workload-specific value proposition.\n  - `NoHelpNeededFromMicrosoft` — partner-led referral where no\n    Microsoft assistance is requested; included so partners can\n    signal intent explicitly."
          enum:
          - GeneralOrOther
          - CustomerTechnicalArchitecture
          - ProofOfConceptOrDemo
          - QuotesOrLicensing
          - PostSalesCustomerSuccess
          - WorkloadSpecificValueProposition
          - NoHelpNeededFromMicrosoft
        dealValue:
          type: number
          description: Deal value of the partner-side engagement. Required when inviting a non-Microsoft partner; ignored when inviting Microsoft.
        currency:
          type: string
          description: 'ISO 4217 currency code (see

            [Microsoft .NET ISO currency reference](https://learn.microsoft.com/en-us/dotnet/api/system.globalization.regioninfo.isocurrencysymbol?view=netframework-4.7.2&preserve-view=true)).

            Required when inviting a non-Microsoft partner; ignored when

            inviting Microsoft.'
        closingDateTime:
          type: string
          description: Date the partner is targeting for close. Required when inviting a non-Microsoft partner; ignored when inviting Microsoft.
        solutions:
          type: array
          description: Solutions the customer is interested in for this partner. Required when inviting a non-Microsoft partner; ignored when inviting Microsoft.
          items:
            $ref: '#/components/schemas/SolutionInput'
        team:
          type: array
          description: Members of the partner organization involved in the engagement. Required when inviting a non-Microsoft partner; ignored when inviting Microsoft.
          items:
            $ref: '#/components/schemas/MemberInput'
      required:
      - organizationId
      - organizationName
      - notes
      - team
    StatusChangedInput:
      type: object
      properties:
        statusReason:
          type: string
          description: The reason the referral was declined, closed lost, or closed error.  Should be formatted as $reasonCode:$statusChangeNotes.
        crmId:
          type: string
          description: 'Identifier of the parent CRM record this referral is linked to

            (typically a Salesforce 18-character Opportunity ID).

            15-character Salesforce IDs are accepted and normalized to 18

            characters. Can be used when updating or accepting a referral.'
        crmOrgId:
          type: string
          description: Organization (tenant) ID of the CRM system. Required in multi-org CRM setups to disambiguate which org the `crmId` belongs to. Can be used when updating or accepting a referral.
        team:
          type: array
          description: Represents users in the organizations that are involved in the partner engagement. Can be used when updating or accepting a referral.
          items:
            $ref: '#/components/schemas/MemberInput'
    Error:
      type: object
      description: 'Standard error envelope returned by this API. The `message` field is included

        for most 4xx responses raised by request validation. For 401, 403, and 500

        responses (and for `GET /api/referrals/{referral_id}` 404 responses) the body is

        either `{}` or omitted entirely.'
      properties:
        message:
          type: string
          description: Human-readable description of the error condition.
          example: Your request could not be processed.
    CustomerProfileInput:
      type: object
      description: Customer contact information. Required.
      properties:
        name:
          type: string
          description: The customer organization name.
        isMatchingComplete:
          type: boolean
          description: If the customer was matched using the customer lookup endpoint.
        isMaccEligible:
          type: boolean
          description: Whether the customer is eligible for a Microsoft Azure Consumption Commitment (MACC). Copy this from the `msp_customermacceligibility` field on the matched account in the `customerLookup` response.
        ids:
          type: array
          description: "Customer organization identifiers, copied from whichever lookup\nyou used to find the customer:\n\n  - From `customerLookup` -- populate `id` with\n    `customerAccountDetails.msp_accountnumber` and\n    `profileType: External`.\n  - From a DUNS lookup -- populate `id` with the customer's\n    DUNS number and `profileType: duns`."
          items:
            type: object
            properties:
              id:
                type: string
                description: Customer organization identifier. Source value depends on `profileType`.
              profileType:
                type: string
                description: "Identifier source. Allowed values:\n\n  - `External` -- `id` is `customerAccountDetails.msp_accountnumber` from `customerLookup`.\n  - `duns` -- `id` is the customer's DUNS number from a DUNS lookup."
                enum:
                - External
                - duns
            required:
            - id
            - profileType
        address:
          $ref: '#/components/schemas/AddressInput'
        team:
          type: array
          description: The contacts for the customer organization.
          items:
            $ref: '#/components/schemas/MemberInput'
      required:
      - name
      - isMatchingComplete
      - isMaccEligible
    MemberInput:
      type: object
      description: Person on the customer or partner side participating in the engagement (a salesperson, technical contact, or executive sponsor).
      properties:
        firstName:
          type: string
          description: The contact's first name.
        lastName:
          type: string
          description: The contact's surname.
        phoneNumber:
          type: string
          description: The contact's phone number, in any locale-appropriate format.
        email:
          type: string
          description: The contact's email address.
    ReferralMetadata:
      type: object
      description: 'Tackle-side metadata layered onto a referral when returned by

        `getReferral`. Includes Tackle''s stable identifier, CRM linkage

        state, and sync health signals.'
      required:
      - tackleId
      - companyName
      - createdDate
      - lastModifiedDate
      properties:
        tackleId:
          type: string
          description: Tackle's stable identifier for the referral. Use this as your primary key when storing co-sell records on your side.
          example: tackle-referral-2uJY3sgyqBz1EnKzRpx0PNol13A
        companyName:
          type: string
          description: Customer company name as captured by Tackle. Mirrored from the originating create payload.
          example: Test INC.
        companyWebsite:
          type: string
          description: Customer company website as captured by Tackle. Not forwarded to Microsoft Partner Center.
          example: www.testInc.com
        createdDate:
          type: string
          format: date-time
          description: ISO-8601 timestamp recording when the referral record was created in Tackle.
          example: '2025-03-17T12:00:00Z'
        lastModifiedDate:
          type: string
          format: date-time
          description: ISO-8601 timestamp recording when the referral record was last modified in Tackle.
          example: '2025-03-17T12:00:00Z'
        pendingRequestIds:
          type: array
          description: Identifiers of in-flight requests for this referral. Each entry corresponds to a `requestId` that has been issued but not yet observed in `listReferralEvents`.
          items:
            type: string
          example:
          - 00123456789ABCDEFGHIJKL
        crmId:
          type: string
          description: 'Identifier of the parent CRM record this referral is linked to

            (typically a Salesforce 18-character Opportunity ID). 15-character

            Salesforce IDs are accepted and normalized to 18 characters.'
          example: 006ABCDEFGHIJKLMNO
        crmOrgId:
          type: string
          description: Organization (tenant) ID of the CRM system. Required in multi-org CRM setups to disambiguate which org the `crmId` belongs to.
          example: testOrg
        hasCloudErrors:
          type: boolean
          description: True when at least one recent call to Microsoft Partner Center for this referral returned an error. Inspect `listReferralEvents` for details.
          example: false
        hasSalesforceErrors:
          type: boolean
          description: True when at least one recent Salesforce sync attempt for this referral failed. Inspect `salesforceSyncError` and `listReferralEvents` for details.
          example: false
        salesforceSyncError:
          type: string
          description: Most recent Salesforce sync error message recorded for this referral. Omitted when no error has been recorded.
          example: Error syncing to Salesforce
        archivedAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp recording when the referral was archived. Omitted when the referral is not archived.
          example: '2025-03-17T12:00:00Z'
        relatedReferrals:
          type: array
          description: Other referrals related to this one (for example, the partner-side counterpart on a partner-led co-sell engagement). Each entry is a full `Referral`.
          items:
            $ref: '#/components/schemas/Referral'
        classification:
          type: string
          description: "Microsoft Partner Center referral classification. Values:\n\n  - `profileMarketplaceLead` — marketplace lead from a profile listing.\n  - `offerMarketplaceLead` — marketplace lead from an offer listing.\n  - `coMarketingQualifiedLead` — co-marketing-qualified lead.\n  - `jointPlanningQualifiedLead` — lead generated through joint planning.\n  - `qualifiedLead` — generic qualified lead.\n  - `solutionAssessment` — solution-assessment engagement.\n  - `oemiot` — OEM IoT engagement.\n  - `services` — services co-sell engagement.\n  - `ip` — IP co-sell engagement.\n  - `unknown` — Microsoft did not classify the referral."
          enum:
          - profileMarketplaceLead
          - offerMarketplaceLead
          - coMarketingQualifiedLead
          - jointPlanningQualifiedLead
          - qualifiedLead
          - solutionAssessment
          - oemiot
          - services
          - ip
          - unknown
        dealType:
          type: string
          description: Deal type is only applicable to referrals classified as ip or services. Newly-created referrals start as `draft` and transition to one of the other values once submitted.
          enum:
          - draft
          - coSell
          - p2p
          - partnerLed
          - private
        lastCRMSyncCloud:
          type: string
          format: date-time
          description: Timestamp of the last CRM-to-Microsoft-Partner-Center sync attempt
          example: '2025-03-17T12:00:00Z'
        lastCRMSyncCloudStatus:
          type: string
          description: Status of the last CRM-to-Microsoft-Partner-Center sync attempt
          enum:
          - success
          - failed
          example: success
        lastCRMSyncCloudSuccessful:
          type: string
          format: date-time
          description: Timestamp of the last successful CRM-to-Microsoft-Partner-Center sync
          example: '2025-03-17T12:00:00Z'
        lastCRMSyncReceived:
          type: string
          format: date-time
          description: Timestamp of the last data-change event received from the CRM for this referral. Updated on every data-change event (including events that result in no push to Microsoft Partner Center), so it ticks forward whenever Salesforce sends a change — independent of Microsoft Partner Center push health reported by lastCRMSyncCloudStatus.
          example: '2025-03-17T12:00:00Z'
        lastCRMSyncReceivedStatus:
          type: string
          description: 'Snapshot of the referral''s lifecycle state at the moment of the

            last data-change event from Salesforce. This is a state label,

            not a success/failure indicator — for the "did Salesforce sync

            recently?" signal use `lastCRMSyncReceived`, and for sync health

            use `lastCRMSyncCloudStatus`.


            The set of values is open and may grow over time, so clients

            should treat unrecognized values as a safe default. Current

            values include (non-exhaustive): `pendingCreation`,

            `pendingAcceptance`, `active`, `transitionClosedWon`,

            `transitionClosedLost`, `transitionClosedError`, `closedWon`,

            `closedLost`, `closedError`, `closedDeclined`.'
          example: active
        lastCRMSyncReceivedChanges:
          type: object
          additionalProperties: true
          description: Map of field name to new value applied by the last data-change event. Empty or absent when the event resulted in no field changes. Intended for future "what changed?" UI; not rendered in the current UI.
          example:
            dealValue: 12345
            currency: USD
    ConsentUpdateInput:
      type: object
      description: Consent flags around sharing information with other organizations and allowing them to contact users. Required.
      properties:
        consentToShareReferralWithMicrosoftSellers:
          type: boolean
          description: Indicates consent to share the deal with Microsoft sellers.  Note that to make a referral Partner-led, consentToShareReferralWithMicrosoftSellers is supplied as true. An active Private referral can be converted to Partner-led just by updating the referral for this field.
    CreateReferralInput:
      type: object
      properties:
        name:
          type: string
          description: The name of the Referral
        companyWebsite:
          type: string
          description: URL of the customer organization. Captured by Tackle for context and not forwarded to Microsoft Partner Center.
        crmId:
          type: string
          description: 'Identifier of the parent CRM record this referral is linked to

            (typically a Salesforce 18-character Opportunity ID). 15-character

            Salesforce IDs are accepted and normalized to 18 characters.'
        crmOrgId:
          type: string
          description: Organization (tenant) ID of the CRM system. Required in multi-org CRM setups to disambiguate which org the `crmId` belongs to.
        mpnId:
          type: string
          description: The MPN ID of the partner
        campaignId:
          type: string
          description: Marketing campaign ID
        dealSensitivity:
          type: string
          description: The sensitivity of the deal based on the selected customer.
          enum:
          - USFed
          - None
        customerProfile:
          $ref: '#/components/schemas/CustomerProfileInput'
        consent:
          $ref: '#/components/schemas/ConsentInput'
        details:
          $ref: '#/components/schemas/DetailsInput'
        team:
          type: array
          description: Represents users in the organizations that are involved in the partner engagement.
          items:
            $ref: '#/components/schemas/MemberInput'
        inviteContexts:
          type: array
          description: Include to invite Microsoft or another organization to the deal.
          items:
            $ref: '#/components/schemas/InviteContextInput'
      required:
      - name
      - mpnId
      - dealSensitivity
      - team
      - customerProfile
      - consent
      - details
    UpdateReferralInput:
      type: object
      properties:
        name:
          type: string
          description: The name of the Referral
        campaignId:
          type: string
          description: Marketing campaign ID.
        salesStage:
          type: string
          description: "Microsoft Partner Center sales-stage code, transmitted as a\nstring. Microsoft's published stages map to:\n\n  - `10` -- Accepted\n  - `20` -- Qualified\n  - `40` -- Developed\n  - `60` -- Proposed\n  - `80` -- Negotiated\n  - `100` -- Won\n\nMicrosoft-defined stage codes outside this list are accepted\nand forwarded unchanged, so treat the value as free-form on\nthe client."
        consent:
          $ref: '#/components/schemas/ConsentUpdateInput'
        details:
          $ref: '#/components/schemas/DetailsUpdateInput'
        team:
          type: array
          description: Represents users in the organizations that are involved in the partner engagement. Can be used when updating or accepting a referral.
          items:
            $ref: '#/components/schemas/MemberInput'
        inviteContexts:
          type: array
          description: Include to invite Microsoft or another organization to the deal.
          items:
            $ref: '#/components/schemas/InviteContextInput'
      required:
      - team
    DetailsInput:
      type: object
      description: Customer details, notes, deal value, currency closing date. Required.
      properties:
        notes:
          type: string
          description: Notes for the referral.
        dealValue:
          type: number
          description: Value of the referral.
        currency:
          type: string
          description: The ISO 4217 currency symbol. https://learn.microsoft.com/en-us/dotnet/api/system.globalization.regioninfo.isocurrencysymbol?view=netframework-4.7.2&preserve-view=true
        closingDateTime:
          type: string
          description: Date the customer is looking to close by.
        requirements:
          $ref: '#/components/schemas/RequirementsInput'
      required:
      - dealValue
      - currency
      - closingDateTime
    DetailsUpdateInput:
      type: object
      description: Customer details, notes, deal value, currency closing date. Required.
      properties:
        notes:
          type: string
          description: Notes for the referral.
        dealValue:
          type: number
          description: Value of the referral.
        currency:
          type: string
          description: The ISO 4217 currency symbol. https://learn.microsoft.com/en-us/dotnet/api/system.globalization.regioninfo.isocurrencysymbol?view=netframework-4.7.2&preserve-view=true
        closingDateTime:
          type: string
          description: Date the customer is looking to close by.
        requirements:
          $ref: '#/components/schemas/RequirementsUpdateInput'
    ConsentInput:
      type: object
      description: Consent flags around sharing information with other organizations and allowing them to contact users. Required.
      properties:
        consentToShareReferralWithMicrosoftSellers:
          type: boolean
          description: Indicates consent to share the deal with Microsoft sellers.  Note that to make a referral Partner-led, consentToShareReferralWithMicrosoftSellers is supplied as true. An active Private referral can be converted to Partner-led just by updating the referral for this field.
        consentToToShareInfoWithOthers:
          type: boolean
          description: Indicates consent to share personal data with others. Must be true.
        consentToContact:
          type: boolean
          description: Indicates consent to contact users.  Must be true.
        consentToMicrosoftToContactSpecificPartners:
          type: boolean
          description: Indicates consent to let Microsoft contact specific partners for this deal.
      required:
      - consentToShareReferralWithMicrosoftSellers
      - consentToToShareInfoWithOthers
      - consentToContact
    Target:
      type: object
      description: Sales target attached to the referral, identifying which solution profile or business profile location the referral is aimed at.
      properties:
        id:
          type: string
          description: Microsoft Partner Center identifier for the target resource.
        type:
          type: string
          description: "What kind of target the `id` refers to.\n\n  - `BusinessProfileLocation` -- a published business profile location.\n  - `SolutionProfile` -- a published solution profile."
          enum:
          - BusinessProfileLocation
          - SolutionProfile
    ListReferralEvent:
      type: object
      required:
      - operation
      - eventId
      - timestamp
      properties:
        operation:
          type: string
          description: "Identifier of the action that produced this history event. The set of values is\nopen-ended: it includes both client-callable operation IDs (the same values\naccepted by the `tackle-operation-id` request header) and additional values\nrecorded automatically when a CRM sync event is captured (for example,\n`referral_INSERT`, `referral_MODIFY`, where the suffix reflects whether the\nevent recorded a new CRM record or an update). Treat this field as a free-form\nstring and use a default branch when displaying it.\n\nCommon values clients will see include:\n  - Referral lifecycle: `createIPReferral`, `retryCreateIPReferral`,\n    `createIPReferralFromDraft`, `cloneIPReferral`, `createDraftIPReferral`,\n    `updateIPReferral`, `updateDraftIPReferral`, `closeWonReferral`,\n    `closeLostReferral`, `closeErrorReferral`, `acceptIncomingReferral`,\n    `declineIncomingReferral`.\n  - CRM sync (Salesforce): `updateReferralCRMID`, `resyncReferralToCRM`,\n    `requestSyncFromSalesforce`, `referral_INSERT`, `referral_MODIFY`.\n  - System-generated history events: `create`, `cloudUpdateEvent`,\n    `internalUpdateEvent`, `salesforceSyncRequestedEvent`.\n  - Test-environment-only: `createInboundIPReferral` (emitted when a test-environment\n    vendor simulates an inbound referral from Microsoft)."
          example: cloudUpdateEvent
        eventId:
          type: string
          example: 2lsw6rdFuCz0d7cVNCubTYGSznY
        timestamp:
          type: string
          example: '2024-09-10T15:25:19.000Z'
        rawRequest:
          type: object
          description: 'Raw JSON body of the API request that produced this event,

            when available. Properties depend on the originating

            operation; the schema is intentionally open.'
          properties:
            targetCloseDate:
              type: string
          additionalProperties: true
        cloudRaw:
          type: object
          description: 'Full Microsoft Partner Center referral document associated with

            the event, when captured (for example, on a `cloudUpdateEvent`).

            Schema mirrors `Referral` but is left open because Microsoft is

            the system of record for this payload.'
          additionalProperties: true
        cloudResponses:
          description: 'Microsoft Partner Center responses recorded for this event. On

            success, `rawResponse` carries Microsoft''s response body. On

            failure, `errorType` is set, `errorDetails` carries the

            Microsoft error envelope, `errorMessage` carries a generic

            message for unknown errors, and `errors` carries field-keyed

            validation messages.'
          type: array
          items:
            type: object
            properties:
              requestId:
                type: string
              operation:
                type: string
              rawResponse:
                type: object
                description: Raw cloud response body. Shape depends on the operation; intentionally open.
                additionalProperties: true
              success:
                type: boolean
              timestamp:
                type: string
              errorType:
                type: string
              errorDetails:
                type: object
                description: 'Microsoft error envelope captured from the upstream call.

                  Always present in the response. On successful operations

                  this object is serialized with zero-value strings:

                  `{code: "", message: "", target: ""}`. Use `success`

                  and/or `errorType` to determine whether the envelope

                  contains a real error.'
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  target:
                    type: string
                  innerError:
                    type: object
                    description: Recursive Microsoft error inner-error structure.
                    additionalProperties: true
              errorMessage:
                type: string
                description: Generic error message for unknown / non-structured errors.
              errors:
                type: object
                description: Map of field name to error messages. The synthetic key `$errors` carries non-field-scoped messages.
                additionalProperties:
                  type: array
                  items:
                    type: string
        cloudRequests:
          type: array
          items:
            type: object
            properties:
              requestId:
                type: string
              operation:
                type: string
              timestamp:
                type: string
              request:
                type: object
                description: Raw cloud request body. Shape depends on the operation; intentionally open.
                additionalProperties: true
        crmRequests:
          type: array
          description: CRM-side request records. Emitted for events sourced from CRM-sync history items.
          items:
            type: object
            properties:
              requestID:
                type: string
                description: Note that the CRM request/response records use `requestID` (capital `ID`) rather than `requestId`.
              operation:
                type: string
              timestamp:
                type: string
              request:
                type: object
                additionalProperties: true
        crmResponses:
          type: array
          description: CRM-side response records. Emitted for events sourced from CRM-sync history items.
          items:
            type: object
            properties:
              requestID:
                type: string
                description: Note that the CRM request/response records use `requestID` (capital `ID`) rather than `requestId`.
              operation:
                type: string
              rawResponse:
                type: object
                description: Raw CRM response body. Shape depends on the operation; intentionally open.
                additionalProperties: true
              success:
                type: boolean
              timestamp:
                type: string
              errorType:
                type: string
              errorDetails:
                type: object
                description: Salesforce error envelope captured from the upstream call.
                properties:
                  errorCode:
                    type: string
                  message:
                    type: string
                  fields:
                    type: array
                    items:
                      type: string
                  request:
                    type: string
                  response:
                    type: string
              errorMessage:
                type: string
                description: Generic error message for unknown / non-structured errors.
        activityDetails:
          type: object
          description: 'Combined display text and event principal recorded for the

            history event. The principal fields (`id`, `type`,

            `givenName`, `familyName`, `pictureUrl`, `email`) describe

            the principal that produced the event and are flattened

            onto the same object alongside `displayText`.'
          properties:
            displayText:
              type: string
            id:
              type: string
              description: Identifier of the principal that produced the event. Common values include `tackle-internal-update` (used when an update originated from an automated Tackle process) and `microsoft-update` (used when an update originated from Microsoft).
            type:
              type: string
              description: "Type of principal that produced the event. The set of values is\nopen; common values include:\n\n  - `user` — an interactive Microsoft Partner Center user\n    (typically authenticated with a work account).\n  - `otkuser` — a Microsoft Partner Center \"OTK\" (one-time-key)\n    user, used for service-to-service or guest principals that\n    sign in without a long-lived directory account. Treat the\n    same as `user` for display purposes unless your integration\n    cares about the auth path.\n  - `machine` — a service principal acting on behalf of an\n    application rather than a person.\n  - `tackle-automation` — events produced by automated Tackle\n    processes (CRM sync, scheduled actions) rather than direct\n    user action.\n\nTreat unrecognized values as a safe default on the client."
            givenName:
              type: string
            familyName:
              type: string
            pictureUrl:
              type: string
            email:
              type: string
    RequirementsInput:
      type: object
      description: Industry, products, service type, and solutions the customer is interested in.
      properties:
        solutionArea:
          type: string
          description: The Solution area of the Customer need in the opportunity. Required for Services co-sell referrals only
        solutionPlay:
          type: string
          description: The Solution play of the Customer need in the opportunity. Required for Services co-sell referrals only
        customerMarketplaceIntent:
          type: string
          description: Indicates the customers purchase intent on Microsoft marketplace.
        solutions:
          type: array
          description: The solutions the customer is interested in.
          items:
            $ref: '#/components/schemas/SolutionInput'
      required:
      - customerMarketplaceIntent
    InviteContext:
      type: object
      description: 'Read-side representation of the invite context returned on a

        referral. The shape differs from the request-side

        `InviteContextInput`: the inviting organization is wrapped under

        `invitedBy`, and `assistanceRequestCode` is typed as a free-form

        string so that any value Microsoft returns is preserved verbatim

        (including values outside the input enum, such as `Unknown`).

        When constructing a request, use `InviteContextInput`; when

        reading a referral, expect this shape.'
      properties:
        notes:
          type: string
          description: Notes the inviting organization provided when inviting another organization into the partner engagement.
        invitedBy:
          type: object
          description: The organization that initiated the invite.
          properties:
            organizationId:
              type: string
              description: The organization ID that sent the referral.
            organizationName:
              type: string
              description: The organization name that sent the referral.
        assistanceRequestCode:
          type: string
          description: Type of help requested by the inviting organization. Whatever value Microsoft sent is returned as-is, which can include values outside the input enum (for example `Unknown`).
        invitedMpnId:
          type: string
          description: MPN ID of the invited partner, when present.
    Referral:
      type: object
      description: 'Read-side representation of a co-sell referral as returned by

        `getReferral` and `listReferralEvents`. Fields are populated

        from Microsoft Partner Center; `null` or omitted fields

        indicate Microsoft did not return a value for that referral.'
      properties:
        id:
          type: string
          description: Microsoft Partner Center referral ID. Stable across the lifetime of the referral.
        engagementId:
          type: string
          description: Microsoft Partner Center engagement ID. All related referrals (for example, partner-led co-sell pairings) share the same `engagementId`.
        name:
          type: string
          description: Caller-supplied human-readable name for the referral.
        externalReferenceId:
          type: string
          description: Optional external reference ID supplied by the partner system, when present.
        createdDateTime:
          type: string
          format: date-time
          description: ISO-8601 timestamp recording when the referral was created.
        updatedDateTime:
          type: string
          format: date-time
          description: ISO-8601 timestamp recording when the referral was last updated.
        expirationDateTime:
          type: string
          format: date-time
          description: ISO-8601 timestamp recording when the referral will expire.
        acceptedDateTime:
          type: string
          format: date-time
          description: ISO-8601 timestamp recording when the referral was accepted by the receiving partner. For outgoing referrals this matches `createdDateTime`.
        status:
          type: string
          description: "Top-level lifecycle stage of the referral. Combine with\n`substatus` to determine the precise state. Values:\n\n  - `None` — no status has been set yet (typically observed only\n    on draft referrals before submission to Microsoft).\n  - `New` — the referral has been created and is awaiting action\n    by the receiving organization.\n  - `Active` — the referral has been accepted and is currently\n    being worked.\n  - `Closed` — the referral has reached a terminal state; see\n    `substatus` (`Won`, `Lost`, `Declined`, `Expired`, `Error`)\n    for the outcome."
          enum:
          - None
          - New
          - Active
          - Closed
        substatus:
          type: string
          description: "Sub-state of the referral, scoped to the parent `status`. Values:\n\n  - `None` — no sub-state has been set.\n  - `Pending` — submission to Microsoft is in flight or awaiting\n    acceptance.\n  - `Received` — Microsoft has received the referral and it is\n    awaiting partner action.\n  - `Accepted` — the receiving organization has accepted the\n    referral.\n  - `Won` — the referral closed as a won deal.\n  - `Lost` — the referral closed as lost.\n  - `Declined` — the receiving organization declined the\n    referral.\n  - `Expired` — the referral was closed because no action was\n    taken within Microsoft's allowed window.\n  - `Error` — the referral closed in an error state; see\n    `statusReason` for the reported reason."
          enum:
          - None
          - Pending
          - Received
          - Accepted
          - Won
          - Lost
          - Declined
          - Expired
          - Error
        statusReason:
          type: string
          description: Reason supplied when the referral closed (won, lost, declined, or error). Format follows `<reasonCode>:<freeFormNotes>`.
        type:
          type: string
          description: "Whether the referral is shared between the seller and a\npartner organization or independent.\n\n  - `Shared` — both sides see the referral.\n  - `Independent` — only the originating organization sees it."
          enum:
          - Shared
          - Independent
        tags:
          type: array
          description: Microsoft-applied tags on the referral, such as `IPCosell`. Treat as opaque labels.
          items:
            type: string
        qualification:
          type: string
          description: "Sales qualification level reported by Microsoft.\n\n  - `None` — not qualified.\n  - `Direct` — direct customer interest, no MQL/SQL qualification.\n  - `MarketingQualified` — marketing-qualified lead.\n  - `SalesQualified` — sales-qualified lead."
          enum:
          - None
          - Direct
          - MarketingQualified
          - SalesQualified
        customerProfile:
          $ref: '#/components/schemas/CustomerProfileInput'
        consent:
          $ref: '#/components/schemas/ConsentInput'
        details:
          $ref: '#/components/schemas/DetailsInput'
        team:
          type: array
          description: Members of the partner or seller organization participating in the engagement.
          items:
            $ref: '#/components/schemas/MemberInput'
        inviteContext:
          $ref: '#/components/schemas/InviteContext'
        eTag:
          type: string
          description: Concurrency token for the referral as reported by Microsoft Partner Center. Treat the value as opaque.
        target:
          type: array
          description: Microsoft Partner Center targets attached to the referral (for example, the published business profile location or solution profile this referral is aimed at).
          items:
            $ref: '#/components/schemas/Target'
        mpnId:
          type: string
          description: Microsoft Partner Network (MPN) ID of the originating partner.
        organizationId:
          type: string
          description: Microsoft Partner Center organization ID of the originating partner.
        organizationName:
          type: string
          description: Display name of the originating partner organization.
        lastModifiedVia:
          type: string
          description: Identifier of the principal that produced the most recent modification (for example, the Microsoft Partner Center user ID or the ID of an automated process).
        lastRunId:
          type: string
          description: Identifier of the most recent processing run that touched the referral. Useful for correlating with audit logs.
        referralSource:
          type: string
          description: Source channel that produced the referral (for example, a marketplace listing or a partner-initiated co-sell).
        favorite:
          type: boolean
          description: Whether the referral has been marked as a favorite by the originating user.
        campaignId:
          type: string
          description: Marketing campaign ID, when the referral was created from a campaign.
        salesStage:
          type: string
          description: Microsoft Partner Center sales-stage code, transmitted as a string. See `UpdateReferralInput.salesStage` for the published code-to-stage mapping.
        quality:
          type: string
          description: Microsoft-reported lead-quality grade for the referral (for example, `Unknown`). Treat unrecognized values as a safe default.
        isSpam:
          type: boolean
          description: Whether Microsoft has flagged the referral as spam.
        direction:
          type: string
          description: "Whether the referral is moving outbound from the partner to\nMicrosoft, or inbound from Microsoft to the partner.\n\n  - `Incoming` — the referral was originated outside the\n    partner organization (for example, by Microsoft) and is\n    being shared with the partner.\n  - `Outgoing` — the referral was originated by the partner\n    and submitted to Microsoft."
          enum:
          - Incoming
          - Outgoing
        referralProgram:
          type: string
          description: Microsoft co-sell program associated with this referral, when assigned by Microsoft.
        dealSensitivity:
          type: string
          description: Special-handling marker for the referral. Currently the only emitted value is `USFed` (US Federal customer); otherwise the value is `None`.
        createdVia:
          type: string
          description: Identifier of the principal that originally created the referral (Microsoft Partner Center user ID or automated-process ID).
        closedDateTime:
          type: string
          format: date-time
          description: ISO-8601 timestamp recording when the referral was closed (won, lost, declined, or in error).
        callToAction:
          type: string
          description: Microsoft-suggested next action for the referral, when provided.
        registrationStatus:
          type: string
          description: Microsoft Partner Center deal-registration state for the referral (for example, `None` when registration is not applicable). Treat unrecognized values as a safe default.
        isAutoRegistrationEnabled:
          type: boolean
          description: Whether Microsoft will automatically register the deal on behalf of the partner.
        links:
          type: object
          description: Microsoft Partner Center HATEOAS links for follow-up navigation, keyed by relation name. See `Link`.
          additionalProperties:
            $ref: '#/components/schemas/Link'
        trackingInfo:
          $ref: '#/components/schemas/TrackingInfo'
        exception:
          description: Free-form exception payload captured when the referral entered an error state, when present. The value may be a structured object or a JSON-encoded string; treat as best-effort diagnostic context.
          oneOf:
          - type: object
          - type: string
          example: '{"key": "value"}'
    RequirementsUpdateInput:
      type: object
      description: Industry, products, service type, and solutions the customer is interested in.
      properties:
        customerMarketplaceIntent:
          type: string
          description: Indicates the customers purchase intent on Microsoft marketplace.
        solutions:
          type: array
          description: The solutions the customer is interested in.
          items:
            $ref: '#/components/schemas/SolutionInput'
    ReferralResponse:
      allOf:
      - $ref: '#/components/schemas/Referral'
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/ReferralMetadata'
  responses:
    Forbidden:
      description: 'The authenticated principal does not have permission to perform this operation.

        The response body is `{}` — the `message` field is omitted.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {}
    Unauthorized:
      description: 'The request did not include a valid Tackle MTM access token, so no principal

        could be established. The response body is `{}` — the `message` field is omitted.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: {}
    Conflict:
      description: 'The request conflicts with an existing resource. For example, attempting to

        create or accept a referral with a CRM ID that is already linked to another

        co-sell opportunity.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: A co-sell opportunity already exists for this CRM ID
    NotFound:
      description: "The requested resource was not found.\n\nThe response body shape depends on the operation:\n\n- Read operations (for example `getReferral`) return an empty body\n  (no JSON envelope).\n- Write operations that look up a resource by ID before acting on it\n  (for example `updateIPReferral` with `tackle-operation-id:\n  requestSyncFromSalesforce`) return a JSON envelope of the form\n  `{\"message\": \"Referral not found\"}`."
    InternalServerError:
      description: 'An unexpected error occurred while processing the request. The response body is

        empty.'
    BadRequest:
      description: 'The request was malformed or could not be processed. Returned when the JSON body

        cannot be parsed, when a required field is missing, when an unsupported

        `tackle-operation-id` is supplied, or when a referenced CRM ID is invalid.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Your request could not be processed.
  parameters:
    referral_id:
      name: referral_id
      in: path
      required: true
      description: The unique identifier for the referral
      schema:
        type: string
        example: tackle-cosell-2jhD8b41CurTOqEsG2Soinublv3
  securitySchemes:
    tackleJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Tackle-issued JWT (interactive user or MTM token).
