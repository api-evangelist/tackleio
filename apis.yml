aid: tackleio
name: Tackle.io
description: 'Tackle.io is the Cloud Marketplace and Co-Sell platform that helps software vendors list,
  sell, co-sell, and meter through the AWS, Microsoft Azure, and Google Cloud marketplaces. The Tackle
  developer surface spans nine services: a core Platform API (authentication, webhooks, metering/usage
  records, products, subscriptions, disbursements, invoices, registrations), a Prospect buyer-signal scoring
  API, Co-Sell APIs for AWS Partner Central, Microsoft Partner Center, and Google Cloud, Private Offer
  APIs for the AWS and Microsoft marketplaces, a public Contracts API, and a SCIM 2.0 user-provisioning
  API. Authentication is OAuth 2.0 client-credentials (machine-to-machine) issuing short-lived JWT bearer
  tokens gated by fine-grained RBAC permissions.'
